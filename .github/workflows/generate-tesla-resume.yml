name: Generate Tesla Resume PDF

on:
  workflow_dispatch:
  push:
    paths:
      - resume-tesla.html
      - resume-tesla.css
      - shared.css
      - generate-pdf.mjs
      - .github/workflows/generate-tesla-resume.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generate Tesla resume PDF
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: node generate-pdf.mjs resume-tesla.html
      - name: Commit generated PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resume-tesla.pdf
          git diff --cached --quiet || git commit -m "Regenerate Tesla resume PDF"
          git push
